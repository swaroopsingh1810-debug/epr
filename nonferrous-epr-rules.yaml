# ============================================================================
# NON-FERROUS METAL EPR — MACHINE-READABLE RULES CONFIGURATION
#
# Source of truth: Gazette of India, Extraordinary, Part II Sec 3(i), No. 395
#   G.S.R. 438(E), dated 1 July 2025
#   Hazardous and Other Wastes (Management and Transboundary Movement)
#   Amendment Rules, 2025 — inserting Chapter VIII into the 2016 Rules
#   Issued by MoEFCC. F.No. 12/84/2024-HSMD
#
# DESIGN PRINCIPLE: every value below carries a `src` pointing to the exact
# rule or schedule it came from. No value enters this file from a blog,
# a consultancy summary, or inference. If it is not in the gazette, it goes
# under `cpcb_pending` — not into the tables.
# ============================================================================

meta:
  config_version: "0.3.0"
  extracted_on: "2026-09-16"
  instrument: "G.S.R. 438(E)"
  notified: "2025-07-01"
  in_force_from: "2026-04-01"
  chapter: "VIII"
  parent_rules: "Hazardous and Other Wastes (Management and Transboundary Movement) Rules, 2016"
  naming_warning: >
    The draft was G.S.R. 499(E) dated 14 Aug 2024, titled "Second Amendment
    Rules, 2024". The final instrument is titled "Amendment Rules, 2025".
    Some law firm notes still cite the draft title. Same document.
  metals_covered: [aluminium, copper, zinc, alloys_thereof]   # src: rule 44(k)

# ----------------------------------------------------------------------------
